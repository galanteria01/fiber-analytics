name: Bug report
description: Report a bug in FiberAnalytics
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in the details below so we can reproduce it.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear, concise description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Run `pnpm install && pnpm build:packages`
        2. Open …
        3. Click …
        4. Observe …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages, stack traces, or screenshots if relevant.
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: e.g. 20.18.0 (run `node -v`)
    validations:
      required: false

  - type: input
    id: pnpm
    attributes:
      label: pnpm version
      placeholder: e.g. 10.33.0 (run `pnpm -v`)
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser (if applicable)
      placeholder: e.g. Chrome 131, Firefox 133, Safari 18
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. macOS 15.2, Ubuntu 24.04, Windows 11
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other information that might be relevant.
    validations:
      required: false
